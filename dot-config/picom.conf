# picom - light touch. glx on the igpu, vsync, blur only behind dunst, games unredirected.
backend = "glx";
vsync = true;
use-damage = true;
unredir-if-possible = true;          # fullscreen games/videos bypass the compositor entirely
detect-client-opacity = true;
detect-transient = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;

# no fades, no shadows, no rounded corners on regular windows
fading = false;
shadow = false;
corner-radius = 0;

# frosted glass behind notifications only
blur-method = "dual_kawase";
blur-strength = 6;
blur-background = true;
blur-background-frame = true;
blur-background-exclude = [
  "class_g != 'Dunst' && class_g != 'Rofi' && class_g != 'i3bar'",
];

wintypes:
{
  tooltip = { fade = false; shadow = false; opacity = 1.0; focus = true; };
  dock = { shadow = false; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 1.0; };
  dropdown_menu = { opacity = 1.0; };
};
