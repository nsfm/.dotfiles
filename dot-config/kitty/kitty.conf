# kitty - gutted 2026-10-31. defaults aren't restated; `kitty --debug-config` shows the rest.

# font
font_family       Operator Mono Book
bold_font         Operator Mono Medium
italic_font       Operator Mono Book Italic
bold_italic_font  Operator Mono Medium Italic
font_size         11.0

# colors
include blush.conf
background_opacity  0.8
dim_opacity         0.75

# cursor / scrollback
cursor_shape                   block
cursor_stop_blinking_after     15.0
scrollback_lines               200000
scrollback_pager_history_size  64
wheel_scroll_multiplier        5.0

# mouse / selection
focus_follows_mouse         yes
select_by_word_characters   :@-./_~?&=%+#
url_style                   curly

# bell
enable_audio_bell     no
window_alert_on_bell  yes
bell_on_tab           "🔔 "

# window
hide_window_decorations   yes
remember_window_size      yes
confirm_os_window_close   0

# tabs
tab_bar_edge             bottom
tab_bar_style            fade
tab_bar_min_tabs         2
tab_switch_strategy      previous
tab_separator            " ┇"
active_tab_font_style    bold-italic

# integration - shell integration gives click-to-cursor, ctrl+shift+z/x prompt jumps,
# ctrl+shift+g last-command output. remote control over a socket enables the kittens.
shell_integration     enabled
allow_remote_control  socket-only
listen_on             unix:@kitty
clipboard_control     write-clipboard write-primary read-clipboard-ask read-primary-ask

# misc
shell                  .
editor                 vim
update_check_interval  0
linux_display_server   auto
